# Bengü — sürüm derlemesi
# "vX.Y.Z" etiketi gönderildiğinde: kaynakları indirir, veritabanını ve anlam dizinini kurar, testleri çalıştırır,
# Bengu.exe'yi ve Bengu-Kurulum-X.Y.Z.exe'yi derler, öz testi geçerse GitHub Releases sayfasına ekler.
# Elle çalıştırıldığında (workflow_dispatch) yalnız derler ve kurulum dosyasını "artifact" olarak saklar.
name: Sürüm derlemesi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python paketleri
        run: python -m pip install --disable-pip-version-check -r gereksinimler.txt pyinstaller

      - name: Etiket ile sürüm numarası uyumlu mu
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $surum = (Select-String -Path surum.py -Pattern 'SURUM = "(.+)"').Matches[0].Groups[1].Value
          if ("v$surum" -ne "${{ github.ref_name }}") { throw "surum.py ($surum) ile etiket (${{ github.ref_name }}) uyuşmuyor" }

      - name: Kaynakları indir
        run: python araclar/indir.py

      - name: Veritabanını kur
        run: python araclar/aktar.py

      - name: Anlam dizinini kur
        run: python araclar/vektor.py

      - name: Rehber doğruluk testi
        run: python testler/rehber_testi.py

      - name: Bengu.exe derle
        run: python -m PyInstaller paket/bengu.spec --noconfirm --clean --distpath dist --workpath build

      - name: Derlenmiş uygulamanın öz testi
        shell: pwsh
        run: |
          $p = Start-Process dist\Bengu\Bengu.exe -ArgumentList "--oztest","--sessiz" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\Bengu\oztest.txt" -Encoding UTF8
          if ($p.ExitCode -ne 0) { throw "Öz test başarısız" }

      - name: Kurulum dosyasını derle (Inno Setup)
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $surum = (Select-String -Path surum.py -Pattern 'SURUM = "(.+)"').Matches[0].Groups[1].Value
          Push-Location paket
          & $iscc /Q "/DKaynak=$env:GITHUB_WORKSPACE\dist\Bengu" "/DCikti=$env:GITHUB_WORKSPACE\dagitim" "/DSurum=$surum" bengu.iss
          if ($LASTEXITCODE) { throw "Inno Setup başarısız" }
          Pop-Location
          Get-ChildItem dagitim

      - uses: actions/upload-artifact@v4
        with:
          name: Bengu-Kurulum
          path: dagitim/*.exe
          retention-days: 14

      - name: Releases sayfasına ekle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notlar = "paket/surum_notlari/${{ github.ref_name }}.md"
          if (-not (Test-Path $notlar)) { "Bengü ${{ github.ref_name }}" | Out-File $notlar -Encoding utf8 }
          gh release create "${{ github.ref_name }}" (Get-ChildItem dagitim/*.exe).FullName --title "Bengü ${{ github.ref_name }}" --notes-file $notlar
